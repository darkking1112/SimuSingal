[build-system]
requires = ["setuptools>=69", "wheel", "Cython>=3,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-analysis"
version = "0.2.0"
description = "Independent offline signal analysis desktop"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "sigmf==1.11.1"]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7", "pyqtgraph>=0.13,<0.15"]
# 独立训练环境：安装同一个编译 wheel 后再装该 extra；桌面冻结包不使用它。
train = ["torch>=2.2,<3", "torchvision>=0.17,<1", "onnx>=1.16,<2",
         "onnxruntime>=1.17,<2"]

[project.scripts]
signal-analysis = "signal_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*", "signal_analysis*"]

[tool.setuptools.package-data]
# 内置调制识别模型是运行时资源（``amc.default_model_path()`` 按 ``__file__`` 定位），
# 必须随 wheel 分发；否则打包后调制识别会因找不到默认模型而失败。
"signal_analysis.algorithms.amc" = ["*.json"]
