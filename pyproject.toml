[build-system]
requires = ["setuptools>=69", "wheel", "Cython>=3,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "simusignal-workspace"
version = "0.2.0"
description = "Offline scientific data workbench and generic event simulation prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "simpy>=4.1,<5", "sigmf==1.11.1"]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7", "pyqtgraph>=0.13,<0.15"]
dev = ["pytest>=8,<10", "pytest-xdist>=3.5,<4", "Cython>=3,<4", "build>=1,<2", "pyinstaller>=6,<7"]
# AI 检测：ONNX Runtime 推理。不安装时 ml-detect 会给出安装提示，传统检测路径不受影响
ml = ["onnxruntime>=1.17,<2"]
# 模型训练：仅 training/ 目录下的脚本使用，不随发布包分发
train = ["torch>=2.2,<3", "torchvision>=0.17,<1", "onnx>=1.16,<2",
         "onnxruntime>=1.17,<2", "torchsig==2.2.0"]
# TorchSig 数据源：只服务 training/build_torchsig.py（生成 torchsig_bundle）。
# 读端 training/ingest_torchsig.py 只需要 NumPy；本仓库测试不依赖该 extra。
# 与 train 固定相同版本；磁盘需求随数据量变化，小规模验证不要求 TB 级空间。
torchsig = ["torch>=2.2,<3", "torchvision>=0.17,<1", "torchsig==2.2.0"]

[project.scripts]
signal-analysis = "signal_analysis.cli:main"
communication-sim = "communication_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 随包分发的模型文件：内置调制识别基线（合成数据训练，可复核、可重训）
[tool.setuptools.package-data]
"signal_analysis.algorithms.amc" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 默认并行：全量回归主要由 GUI/训练端到端用例决定（串行约 3 min），pytest-xdist 随 [dev] 安装。
# 单用例调试或需要串行输出时追加 -n0。
addopts = "-n auto"
markers = ["gui: requires PySide6 and an offscreen Qt platform",
           "torchsig: real TorchSig generation in an installed training environment",
           "native: builds a local C shared library",
           "ml: needs onnxruntime (the [ml] extra) and an exported ONNX model"]
